name: Build Muguet IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: brew install xcodegen

      - name: Configure Rust
        run: |
          rustup toolchain install 1.98.1
          rustup default 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: Download Game Assets
        run: |
          curl -L "https://www.dropbox.com/scl/fi/pwqnxw93q79crbk3nzlu3/game.zip?rlkey=zwkulv33cwgh71i89pkagzy4z&st=2v1mt2ou&dl=1" -o game.zip
          unzip -l game.zip | head -n 25

      - name: Compile and Package IPA
        run: |
          chmod +x make-ios.sh build.sh
          FREE=1 BUNDLE_ID="com.dev.muguet" ./make-ios.sh game.zip --ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-IPA
          path: build/Muguet.ipa
